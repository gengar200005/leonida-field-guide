name: Publish field guide
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 build.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test tools
        run: |
          python -m pip install playwright==1.51.0
          python -m playwright install --with-deps chromium
      - name: Verify desktop and touch player flows before publishing
        run: python tests/release.py --offline --captures "${{ runner.temp }}/guide-captures"
      - name: Retain desktop and mobile screenshots
        uses: actions/upload-artifact@v4
        with:
          name: player-flow-captures
          path: ${{ runner.temp }}/guide-captures
          retention-days: 14
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - id: publish
        uses: actions/deploy-pages@v4
